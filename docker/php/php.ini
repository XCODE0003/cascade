; Production PHP settings for the Cascade app container.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off

; Ensure $_ENV is populated from container environment variables.
variables_order = "EGPCS"

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M
