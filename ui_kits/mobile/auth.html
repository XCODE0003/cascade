<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cascade — Вход</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font-text); background: var(--bg); overflow: hidden; }
  #root { height: 100vh; display: flex; align-items: stretch; justify-content: center; }
  .phone {
    width: 100%; max-width: 420px;
    height: 100%; max-height: 880px;
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  @media (min-width: 500px) {
    .phone {
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.10), 0 8px 24px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(0,0,0,0.06);
      margin: 20px 0;
    }
  }
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../dashboard/Icons.jsx"></script>
<script type="text/babel" src="MobileShell.jsx"></script>
<script type="text/babel" src="AuthMobile.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<AuthMobile/>);
</script>
