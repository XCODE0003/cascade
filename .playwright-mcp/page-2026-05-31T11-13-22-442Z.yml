            - heading "Два независимых условия" [level=2] [ref=e112]
            - paragraph [ref=e113]: Кнопка «Вывод» в кабинете остаётся неактивной, пока одновременно не выполнятся два условия. Первое — закрашены все 5 ячеек вашего уровня, то есть очередь довела вашу позицию до 150% от номинала. Второе — с момента покупки уровня прошло не менее 7 полных суток.
            - paragraph [ref=e114]: Замок «двойной» именно потому, что ни деньги без времени, ни время без денег не открывают вывод. Это убирает спекулятивный «вход-выход» и держит очередь стабильной для всех участников.
          - generic [ref=e115]:
            - heading "Зачем это нужно" [level=2] [ref=e116]
            - paragraph [ref=e117]: "Очередь работает как замкнутый контур: каждый USDT, который вы получаете, кто-то внёс до вас, а ваш вклад закрывает позиции тех, кто стоит впереди. Если разрешить мгновенный выход, ранние участники забирали бы ликвидность быстрее, чем она поступает, и контур рвался бы."
            - paragraph [ref=e118]: Семидневное окно синхронизирует темп выплат с темпом входящих средств. В результате платформа распределяет ровно 100% поступлений и технически не может уйти в дефицит.
