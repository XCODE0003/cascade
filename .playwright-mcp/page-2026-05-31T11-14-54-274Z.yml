    - generic [ref=e40]:
      - heading "Два независимых условия" [level=2] [ref=e41]
      - paragraph [ref=e42]: Кнопка «Вывод» в кабинете остаётся неактивной, пока одновременно не выполнятся два условия. Первое — закрашены все 5 ячеек вашего уровня, то есть очередь довела вашу позицию до 150% от номинала. Второе — с момента покупки уровня прошло не менее 7 полных суток.
      - paragraph [ref=e43]: Замок «двойной» именно потому, что ни деньги без времени, ни время без денег не открывают вывод. Это убирает спекулятивный «вход-выход» и держит очередь стабильной для всех участников.
    - generic [ref=e44]:
      - heading "Зачем это нужно" [level=2] [ref=e45]
      - paragraph [ref=e46]: "Очередь работает как замкнутый контур: каждый USDT, который вы получаете, кто-то внёс до вас, а ваш вклад закрывает позиции тех, кто стоит впереди. Если разрешить мгновенный выход, ранние участники забирали бы ликвидность быстрее, чем она поступает, и контур рвался бы."
      - paragraph [ref=e47]: Семидневное окно синхронизирует темп выплат с темпом входящих средств. В результате платформа распределяет ровно 100% поступлений и технически не может уйти в дефицит.
    - generic [ref=e48]:
      - heading "Что происходит после разблокировки" [level=2] [ref=e49]
      - paragraph [ref=e50]: Когда оба условия выполнены, заявка на вывод уходит в холд на 72 часа — это анти-фрод окно, в течение которого операция может быть проверена. По истечении холда средства отправляются на ваш адрес без комиссии платформы.
    - generic [ref=e51]:
