x-php: &php
  build:
    context: .
    target: app
  image: cascade-app
  env_file: .env
  environment: &php-env
    APP_ENV: production
    APP_DEBUG: "false"
    CONTAINER_ROLE: worker
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-cascade}
    DB_USERNAME: ${DB_USERNAME:-cascade}
    DB_PASSWORD: ${DB_PASSWORD:-cascade_db_password}
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - cascade-storage:/var/www/html/storage
  restart: unless-stopped

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cascade}
      MYSQL_USER: ${DB_USERNAME:-cascade}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cascade_db_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-cascade_root_password}
    volumes:
      - cascade-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-cascade_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    <<: *php
    environment:
      <<: *php-env
      CONTAINER_ROLE: app
    expose:
      - "9000"

  web:
    build:
      context: .
      target: web
    image: cascade-web
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

  queue:
    <<: *php
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  scheduler:
    <<: *php
    command: php artisan schedule:work

volumes:
  cascade-storage:
  cascade-db:
